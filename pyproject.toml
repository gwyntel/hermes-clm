[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-clm"
# x-release-please-version
version = "0.1.0"
description = "Model-directed context management for Hermes Agent, with a durable archive and deterministic offline benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-MutuaL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "GwynTel" }]
keywords = [
    "agents",
    "context-management",
    "context-engineering",
    "hermes",
    "llm",
    "prompt-caching",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "build>=1.2",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/gwyntel/hermes-clm"
Source = "https://github.com/gwyntel/hermes-clm"
Issues = "https://github.com/gwyntel/hermes-clm/issues"
Changelog = "https://github.com/gwyntel/hermes-clm/blob/main/CHANGELOG.md"

[project.scripts]
hermes-clm = "hermes_clm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hermes_clm*"]

[tool.setuptools.package-data]
hermes_clm = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: exercises a real build or subprocess-heavy path; skipped unless explicitly selected",
]

[tool.coverage.run]
source = ["hermes_clm"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Floor, not a target. Raise as engine/store/tools land with their tests.
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hermes_clm", "benchmarks"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
