[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-clm"
# x-release-please-version
version = "0.3.0"
description = "Model-directed context management for Hermes Agent, with a durable archive and deterministic offline benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-MutuaL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "GwynTel" }]
keywords = [
    "agents",
    "context-management",
    "context-engineering",
    "hermes",
    "llm",
    "prompt-caching",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "build>=1.2",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/gwyntel/hermes-clm"
Source = "https://github.com/gwyntel/hermes-clm"
Issues = "https://github.com/gwyntel/hermes-clm/issues"
Changelog = "https://github.com/gwyntel/hermes-clm/blob/main/CHANGELOG.md"

[project.scripts]
hermes-clm = "hermes_clm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hermes_clm*"]

[tool.setuptools.package-data]
hermes_clm = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The suite mixes packages that reuse basenames (tests/unit/test_projection_purity.py and
# tests/security/test_projection_purity.py). Importlib mode keeps those modules distinct;
# the explicit pythonpath entries replace the sys.path edits the shared conftest used to
# rely on, so a plain `pytest` works from a clean checkout.
addopts = "-ra --import-mode=importlib"
pythonpath = ["src", "tests", "tests/unit", "tests/security"]
markers = [
    "slow: exercises a real build or subprocess-heavy path; skipped unless explicitly selected",
]

[tool.coverage.run]
source = ["hermes_clm"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Floor, not a target. Measured 86% (branch) over the integrated tree on CPython 3.12
# with the full suite collected (556 passed / 121 failed / 2 skipped). The floor sits one
# point below the measurement so a Python-minor drift or one untouched module cannot turn
# the gate red on its own; raise it as the security and fuzz findings are fixed.
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
# Correctness-oriented baseline: real errors (E4/E7/E9), pyflakes (F), import order (I) and
# bugbear (B). `UP`/`RUF` style rewrites are deliberately not gated here -- large parts of
# the integrated engine predate this config and use `typing.Dict`/`Optional`; enabling them
# would make `ruff check .` a mass-rewrite demand rather than a defect signal.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hermes_clm", "benchmarks"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# The repository root carries a Hermes plugin entry-point `__init__.py`, so mypy would
# otherwise treat the checkout directory name ("hermes-clm-delivery-fix") as a package
# and abort with "contains __init__.py but is not a valid Python package name". Mapping the
# source root and requiring explicit package bases keeps the src-layout package named
# `hermes_clm` and leaves the root shim untyped and out of the build.
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true

# Hermes is an optional host, imported lazily behind guards. Its modules are not installed
# in the packaging/CI environment, so missing stubs are expected rather than an error.
[[tool.mypy.overrides]]
module = ["agent.*", "hermes_cli.*", "hermes_constants"]
ignore_missing_imports = true
